<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bí Mật Của Nhựt Lam ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05010f;
            --box-color: #e63946;
            --ribbon-color: #f4a261;
            --glow-color: #ff9a9e;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg-color);
            font-family: 'Baloo 2', cursive;
            color: white;
            perspective: 1000px;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* NÚT BẬT NHẠC SIÊU TO GÓC TRÊN ĐỂ DỄ BẤM */
        #music-toggle-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10005;
            background: rgba(230, 57, 70, 0.85);
            border: 2px solid #fff;
            color: white;
            padding: 10px 18px;
            border-radius: 50px;
            font-family: 'Baloo 2', cursive;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.6);
            animation: pulseBtn 1.5s infinite;
        }
        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(230, 57, 70, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(230, 57, 70, 0); }
        }
        .music-icon {
            font-size: 1.2em;
            animation: spinNote 3s linear infinite;
            display: inline-block;
        }
        .paused .music-icon {
            animation-play-state: paused;
        }
        @keyframes spinNote {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* CHUỖI DÒNG CHỮ INTRO */
        #story-intro {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 10002;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 1s ease-in-out;
        }

        .story-text-line {
            position: absolute;
            font-family: 'Baloo 2', cursive;
            font-size: clamp(1.3em, 4.5vw, 2.2em);
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 154, 158, 0.8);
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
            max-width: 85vw;
            line-height: 1.5;
        }

        .story-text-line.active {
            opacity: 1;
            transform: scale(1);
        }

        /* MÀN HÌNH HỘP QUÀ CHỜ */
        #intro {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
        }

        #intro.show {
            opacity: 1;
            pointer-events: auto;
        }

        .intro-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .cinema-bar {
            position: fixed;
            left: 0; width: 100%; height: 8vh;
            background: #000;
            z-index: 10000;
            transition: height 2s cubic-bezier(0.65, 0, 0.35, 1);
            pointer-events: none;
        }
        .cinema-bar.top { top: 0; }
        .cinema-bar.bottom { bottom: 0; }

        .intro-text {
            text-align: center;
            z-index: 2;
            margin-bottom: 25px;
        }
        .intro-text h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.2em, 7vw, 3.5em);
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            margin: 0 0 5px 0;
        }
        .intro-text p {
            font-size: clamp(0.95em, 3.5vw, 1.2em);
            color: #ccc;
            margin: 0;
        }

        /* HỘP QUÀ 2D */
        .gift-wrapper {
            position: relative;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .gift-wrapper:active {
            transform: scale(0.95);
        }

        .gift-lid {
            width: clamp(120px, 35vw, 150px);
            height: clamp(28px, 8vw, 32px);
            background: var(--box-color);
            border-radius: 6px;
            position: relative;
            z-index: 2;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.3);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .gift-lid::before {
            content: ''; position: absolute; top: 0; left: 50%;
            transform: translateX(-50%);
            width: 22px; height: 100%; background: var(--ribbon-color);
        }

        .bow {
            position: absolute; width: 32px; height: 32px;
            border: 6px solid var(--ribbon-color); border-radius: 50%;
            top: -20px; z-index: -1;
        }
        .bow-left { left: 22px; transform: rotate(-30deg); }
        .bow-right { right: 22px; transform: rotate(30deg); }

        .gift-base {
            width: clamp(110px, 32vw, 135px);
            height: clamp(90px, 26vw, 110px);
            background: var(--box-color);
            margin: 0 auto;
            border-radius: 0 0 8px 8px;
            position: relative;
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.3);
        }

        .gift-base::before {
            content: ''; position: absolute; top: 0; left: 50%;
            transform: translateX(-50%);
            width: 22px; height: 100%; background: var(--ribbon-color);
        }
        .gift-base::after {
            content: ''; position: absolute; top: 40%; left: 0;
            width: 100%; height: 20px; background: var(--ribbon-color);
        }

        /* HIỆU ỨNG TIA SÁNG */
        #flash-overlay {
            position: fixed;
            top: 50%; left: 50%;
            width: 6px; height: 0vh;
            background: linear-gradient(to bottom, #ffffff, #ffeb3b, #ff9a9e);
            box-shadow: 0 0 50px 20px #fff;
            transform: translate(-50%, -50%);
            opacity: 0;
            z-index: 100;
            pointer-events: none;
            transition: height 0.6s ease-in, width 0.6s ease-out 0.5s, opacity 0.4s;
        }
        #flash-overlay.beam-up {
            opacity: 1;
            height: 100vh;
        }
        #flash-overlay.expand-screen {
            width: 100vw;
            transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }

        /* VŨ TRỤ 3D */
        #stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; opacity: 0;
            transition: opacity 2s ease-in;
            background: radial-gradient(circle at 50% 50%, #170b2e 0%, #020005 100%);
        }

        #scene {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0;
            transform-style: preserve-3d;
            z-index: 10;
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        .item {
            position: absolute; transform-style: preserve-3d;
            cursor: pointer; display: flex;
            justify-content: center; align-items: center;
            transition: transform 0.3s ease-out; 
        }

        .item-img {
            width: clamp(120px, 32vw, 180px); 
            height: clamp(160px, 42vw, 240px);
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 154, 158, 0.3), 0 10px 25px rgba(0,0,0,0.8);
            pointer-events: auto;
        }

        .item-text {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(20px, 5.5vw, 32px);
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
            white-space: nowrap; pointer-events: auto;
            background: rgba(255, 255, 255, 0.06);
            padding: 8px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .giant-gift-item {
            flex-direction: column;
            pointer-events: auto;
        }
        .giant-gift-icon {
            font-size: clamp(90px, 22vw, 130px);
            filter: drop-shadow(0 0 25px #ff0000) drop-shadow(0 0 50px #ffaa00);
            animation: heartbeat 1.5s infinite;
        }
        .giant-gift-label {
            font-family: 'Baloo 2', cursive;
            font-size: clamp(16px, 4.5vw, 24px);
            color: #ffeb3b;
            text-shadow: 0 0 15px #ff9800;
            margin-top: 8px;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 5px 18px;
            border-radius: 20px;
            border: 2px solid #ffeb3b;
            box-shadow: 0 0 15px #ffeb3b;
            white-space: nowrap;
            animation: floatLabel 2s infinite alternate;
        }

        @keyframes floatLabel {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.12); }
            30% { transform: scale(1); }
            45% { transform: scale(1.12); }
            70% { transform: scale(1); }
        }

        /* POPUP CHI TIẾT */
        #modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 10000; opacity: 0; transition: opacity 0.3s;
            overflow: hidden;
            padding: 15px;
            box-sizing: border-box;
        }
        
        .modal-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; max-width: 400px;
            transform: scale(0.85); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        
        .modal-content img {
            width: 100%;
            max-width: 80vw; 
            max-height: 40vh; 
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(255, 154, 158, 0.4);
            border: 2px solid rgba(255,255,255,0.2);
            object-fit: contain;
            margin-bottom: 12px; 
        }
        
        .modal-content .modal-text {
            font-family: 'Dancing Script', cursive; 
            font-size: clamp(1.8em, 6vw, 2.6em);
            color: #fff; text-shadow: 0 0 15px rgba(255, 105, 180, 1);
            text-align: center; margin: 0; padding: 0;
        }

        .special-message-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            justify-content: center;
            min-height: 120px;
        }

        .special-msg-line {
            font-family: 'Baloo 2', cursive !important;
            font-size: clamp(1em, 4vw, 1.35em) !important; 
            color: #ffeb3b !important;
            text-shadow: 0 0 12px rgba(255,0,0,0.8) !important;
            line-height: 1.4;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            position: absolute;
            width: 85vw;
            max-width: 400px;
        }

        .special-msg-line.show {
            opacity: 1;
            transform: translateY(0);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            padding: 6px 16px;
            font-size: 0.9em; font-family: 'Baloo 2', cursive;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); color: white;
            border-radius: 50px; cursor: pointer;
            backdrop-filter: blur(5px);
            z-index: 10001;
        }
        
        .music-note-hint {
            position: fixed; bottom: 15px; right: 15px;
            color: rgba(255,255,255,0.4); font-size: 0.8em; z-index: 100;
            letter-spacing: 0.5px;
            opacity: 0; transition: opacity 2s;
            text-align: right;
            pointer-events: none;
        }

        .confetti {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            z-index: 9999;
            animation: fall 3s ease-in forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body onclick="tryPlayMusicOnce()">

    <!-- DÙNG LINK NHẠC CHUẨN PIXABAY ĐỂ TRÁNH BỊ GOOGLE DRIVE CHẶN CORS -->
    <audio id="bg-music" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg" type="audio/ogg">
    </audio>

    <!-- NÚT BẬT/TẮT NHẠC NỔI BẬT GÓC TRÊN -->
    <button id="music-toggle-btn" class="paused" onclick="toggleMusic(event)">
        <span class="music-icon">🎵</span> <span id="music-text">Bật nhạc</span>
    </button>

    <!-- CHUỖI DÒNG CHỮ INTRO -->
    <div id="story-intro">
        <div class="story-text-line" id="line-0">Hôm nay là 31 tháng 10</div>
        <div class="story-text-line" id="line-1">Là ngày lễ tốt nghiệp của ảnh</div>
        <div class="story-text-line" id="line-2">Và cũng là ngày chỉ được sinh ra</div>
        <div class="story-text-line" id="line-3">Thời gian này là dành cho chỉ</div>
        <div class="story-text-line" id="line-4">Ảnh có một món quà nho nhỏ gửi đến chỉ nhân ngày quan trọng này</div>
        <div class="story-text-line" id="line-5">Cùng khám phá với ảnh nhé!</div>
    </div>

    <!-- MÀN HÌNH HỘP QUÀ CHỜ -->
    <div id="intro">
        <div class="intro-container">
            <div class="intro-text">
                <h1>Dành tặng Nhựt Lam...</h1>
                <p>Chạm vào hộp quà để mở</p>
            </div>
            
            <div class="gift-wrapper" onclick="openCinematicGift()">
                <div class="gift-lid" id="gift-lid">
                    <div class="bow bow-left"></div>
                    <div class="bow bow-right"></div>
                </div>
                <div class="gift-base"></div>
            </div>
        </div>
        <div id="flash-overlay"></div>
    </div>

    <div class="cinema-bar top" id="bar-top"></div>
    <div class="cinema-bar bottom" id="bar-bottom"></div>

    <!-- VŨ TRỤ 3D -->
    <div id="stars-container"></div>
    <div id="scene"></div>

    <!-- POPUP CHI TIẾT -->
    <div id="modal">
        <button class="close-btn" onclick="closeModal()">Đóng</button>
        <div class="modal-content" id="modalData"></div>
    </div>
    
    <div class="music-note-hint" id="hint-note">🎵 Vuốt nhẹ để lướt ảnh không gian 3D</div>

    <script>
        const bgMusic = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-toggle-btn');
        const musicText = document.getElementById('music-text');
        let isMusicPlaying = false;

        function tryPlayMusicOnce() {
            if (!isMusicPlaying) {
                bgMusic.volume = 0.6;
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicBtn.classList.remove('paused');
                    musicText.textContent = "Tắt nhạc";
                }).catch(e => console.log("Chờ người dùng tương tác"));
            }
        }

        function toggleMusic(e) {
            e.stopPropagation();
            if (isMusicPlaying) {
                bgMusic.pause();
                isMusicPlaying = false;
                musicBtn.classList.add('paused');
                musicText.textContent = "Bật nhạc";
            } else {
                bgMusic.volume = 0.6;
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicBtn.classList.remove('paused');
                    musicText.textContent = "Tắt nhạc";
                });
            }
        }

        const lines = document.querySelectorAll('.story-text-line');
        let currentLine = 0;

        function playStoryIntro() {
            if (currentLine < lines.length) {
                if(currentLine > 0) {
                    lines[currentLine - 1].classList.remove('active');
                }
                lines[currentLine].classList.add('active');
                currentLine++;
                setTimeout(playStoryIntro, 3000);
            } else {
                setTimeout(() => {
                    document.getElementById('story-intro').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('story-intro').style.display = 'none';
                        document.getElementById('intro').classList.add('show');
                    }, 800);
                }, 800);
            }
        }

        window.onload = () => {
            setTimeout(playStoryIntro, 400);
        };

        const specialGiftConfig = {
            imgSrc: "https://placehold.co/600x600/e63946/ffffff?text=Hinh+Mon+Qua", 
            messages: [
                "Chào chỉ",
                "Ảnh đã ấp ủ ý tưởng này từ khá lâu rồi",
                "Nay ảnh mới có cơ hội để thực hiện",
                "Hy vọng điều này có thể làm cho chỉ cảm thấy bất ngờ và thú vị 💖"
            ]
        };

        const myMemories = [
            { type: 'img', content: 'https://placehold.co/400x500/170b2e/ff9a9e?text=Hinh+Lam+1' },
            { type: 'img', content: 'https://placehold.co/500x400/170b2e/ff9a9e?text=Hinh+Di+Choi' },
            { type: 'img', content: 'https://placehold.co/400x600/170b2e/ff9a9e?text=Hinh+Di+An' },
            { type: 'img', content: 'https://placehold.co/450x450/170b2e/ff9a9e?text=Hinh+Hai+Dua' },
            { type: 'img', content: 'https://placehold.co/400x500/170b2e/ff9a9e?text=Hinh+Cute' },
            
            { type: 'text', content: 'Chúc bé Lam sinh nhật rực rỡ! 🎉' },
            { type: 'text', content: 'Công chúa nhỏ của anh Đa ❤️' },
            { type: 'text', content: 'Tuổi mới ngày càng xinh đẹp nha!' },
            { type: 'text', content: 'Ăn sập Cần Thơ tiếp nhé! 🍜🍣' },
            { type: 'text', content: 'Yêu em bé vô cực luôn! 🥰' },
            { type: 'text', content: 'Mãi luôn hạnh phúc nhé em!' },
            { type: 'text', content: 'Thương em nhất trên đời! 💕' }
        ];

        let isOpening = false;

        function openCinematicGift() {
            if(isOpening) return;
            isOpening = true;
            tryPlayMusicOnce();

            document.getElementById('gift-lid').style.transform = 'translateY(-90px) rotate(20deg) scale(1.15)';
            document.querySelector('.intro-text').style.opacity = '0';
            document.querySelector('.intro-text').style.transition = 'opacity 0.3s';

            const flash = document.getElementById('flash-overlay');
            flash.classList.add('beam-up');

            setTimeout(() => {
                flash.classList.add('expand-screen');
            }, 600);

            setTimeout(() => {
                document.getElementById('intro').style.opacity = '0';
                document.getElementById('bar-top').style.height = '0';
                document.getElementById('bar-bottom').style.height = '0';

                init3DSpace();
                createStars();
                
                document.getElementById('scene').style.opacity = '1';
                document.getElementById('stars-container').style.opacity = '1';
                document.getElementById('hint-note').style.opacity = '1';

                setTimeout(() => {
                    document.getElementById('intro').style.display = 'none';
                }, 1200);
            }, 1400);
        }

        const scene = document.getElementById('scene');
        let elements = [];
        let isPaused = false;
        
        let targetRotX = 0, targetRotY = 0;
        let currentRotX = 0, currentRotY = 0;

        document.addEventListener('mousemove', (e) => {
            if(isPaused) return;
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            targetRotY = x * 25; 
            targetRotX = -y * 25; 
        });

        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            if(e.touches.length > 0) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, {passive: true});

        document.addEventListener('touchmove', (e) => {
            if(isPaused || e.touches.length === 0) return;
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            
            const deltaX = (touchX - touchStartX) / window.innerWidth;
            const deltaY = (touchY - touchStartY) / window.innerHeight;
            
            targetRotY += deltaX * 60;
            targetRotX -= deltaY * 60;
            
            touchStartX = touchX;
            touchStartY = touchY;
        }, {passive: true});

        function init3DSpace() {
            const fullItems = [...myMemories, ...myMemories, ...myMemories]; 
            fullItems.forEach((item) => {
                const el = document.createElement('div');
                el.className = 'item';
                
                if(item.type === 'img') {
                    el.innerHTML = `<img src="${item.content}" class="item-img" alt="Kỷ niệm">`;
                } else {
                    el.innerHTML = `<div class="item-text">${item.content}</div>`;
                }

                const obj = {
                    el: el,
                    data: item,
                    x: (Math.random() - 0.5) * 2800, 
                    y: (Math.random() - 0.5) * 1800, 
                    z: Math.random() * -4500 - 800, 
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    vz: Math.random() * 1.0 + 0.5, 
                    rotZ: (Math.random() - 0.5) * 12,
                    bobAngle: Math.random() * Math.PI * 2,
                    bobSpeed: Math.random() * 0.01 + 0.004
                };

                el.addEventListener('click', () => openModal(obj));
                scene.appendChild(el);
                elements.push(obj);
            });

            setTimeout(() => {
                createGiantGift();
            }, 7000); 

            animate();
        }

        function createGiantGift() {
            const specialEl = document.createElement('div');
            specialEl.className = 'item giant-gift-item';
            specialEl.innerHTML = `
                <div class="giant-gift-icon">🎁</div>
                <div class="giant-gift-label">MỞ QUÀ ĐI EM!</div>
            `;
            
            const specialObj = {
                el: specialEl,
                isSpecial: true,
                x: 0, 
                y: 0, 
                z: -3000, 
                vx: 0,
                vy: 0,
                vz: 1.8, 
                rotZ: 0,
                bobAngle: 0,
                bobSpeed: 0.02
            };

            specialEl.addEventListener('click', openSpecialGift);
            scene.appendChild(specialEl);
            elements.push(specialObj);
        }

        function animate() {
            if (!isPaused) {
                currentRotX += (targetRotX - currentRotX) * 0.05;
                currentRotY += (targetRotY - currentRotY) * 0.05;
                scene.style.transform = `translateZ(500px) rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;

                elements.forEach(obj => {
                    obj.x += obj.vx;
                    obj.y += obj.vy;
                    obj.z += obj.vz; 
                    
                    obj.bobAngle += obj.bobSpeed;
                    const bobY = Math.sin(obj.bobAngle) * 10;

                    let maxZ = obj.isSpecial ? 900 : 600;
                    
                    if (obj.z > maxZ) {
                        obj.z = -4500;
                        obj.x = (Math.random() - 0.5) * 2800;
                        obj.y = (Math.random() - 0.5) * 1800;
                    }

                    obj.el.style.transform = `translate3d(${obj.x}px, ${obj.y + bobY}px, ${obj.z}px) rotateZ(${obj.rotZ}deg)`;
                });
            }
            requestAnimationFrame(animate);
        }

        function createStars() {
            const container = document.getElementById('stars-container');
            for(let i=0; i<120; i++) {
                let star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                let size = Math.random() * 1.8;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.background = 'white';
                star.style.borderRadius = '50%';
                star.style.opacity = Math.random();
                container.appendChild(star);
            }
        }

        function openModal(obj) {
            isPaused = true; 
            const modal = document.getElementById('modal');
            const modalData = document.getElementById('modalData');
            
            if(obj.data.type === 'img') {
                modalData.innerHTML = `<img src="${obj.data.content}">`;
            } else {
                modalData.innerHTML = `<div class="modal-text">${obj.data.content}</div>`;
            }
            
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                modal.querySelector('.modal-content').style.transform = 'scale(1)';
            }, 10);
        }

        let messageTimeouts = [];

        function openSpecialGift() {
            isPaused = true;
            const modal = document.getElementById('modal');
            const modalData = document.getElementById('modalData');

            let msgHTML = `<img src="${specialGiftConfig.imgSrc}" style="border: 3px solid #ffeb3b; box-shadow: 0 0 25px #ffeb3b;">`;
            msgHTML += `<div class="special-message-box">`;
            specialGiftConfig.messages.forEach((msg, idx) => {
                msgHTML += `<div class="special-msg-line" id="msg-line-${idx}">${msg}</div>`;
            });
            msgHTML += `</div>`;

            modalData.innerHTML = msgHTML;

            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                modal.querySelector('.modal-content').style.transform = 'scale(1)';
            }, 10);

            specialGiftConfig.messages.forEach((_, idx) => {
                let t = setTimeout(() => {
                    const lineEl = document.getElementById(`msg-line-${idx}`);
                    if(lineEl) lineEl.classList.add('show');
                }, 700 + (idx * 1200));
                messageTimeouts.push(t);
            });

            fireConfetti();
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.style.opacity = '0';
            modal.querySelector('.modal-content').style.transform = 'scale(0.85)';
            
            messageTimeouts.forEach(t => clearTimeout(t));
            messageTimeouts = [];

            setTimeout(() => {
                modal.style.display = 'none';
                isPaused = false; 
            }, 300);
        }

        function fireConfetti() {
            const modal = document.getElementById('modal');
            const emojis = ['🎉', '💖', '🎁', '✨', '🎂'];
            for(let i = 0; i < 30; i++) {
                let conf = document.createElement('div');
                conf.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = -30 + 'px';
                conf.style.animationDuration = (Math.random() * 2 + 1.2) + 's';
                conf.style.animationDelay = (Math.random() * 0.6) + 's';
                modal.appendChild(conf);
                
                setTimeout(() => conf.remove(), 3500);
            }
        }
    </script>
</body>
</html>
